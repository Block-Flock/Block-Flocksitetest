# =====================================================
# HTTP SERVER (CLOUDFLARE ORIGIN — NO LOCAL SSL)
# =====================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name bricktaria.com www.bricktaria.com;

    root /www/wwwroot/test.net;
    index index.php index.html index.htm;

    # ================= CLOUDFLARE REAL IP =================
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # ================= SECURITY HEADERS =================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ================= LET'S ENCRYPT (IF EVER NEEDED) =================
    # Cloudflare handles TLS, but keep ACME open just in case
    location ^~ /.well-known/acme-challenge/ {
        alias /www/wwwroot/test.net/.well-known/acme-challenge/;
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ================= BLOCK SENSITIVE FILES =================
    location ~ ^/(\.env|\.git|\.svn|\.project|\.htaccess|\.user.ini|LICENSE|README.md) {
        return 404;
    }

    location ~ ^/\.well-known/.*\.(php|jsp|py|lua|zip|tar|gz|sql|bak)$ {
        return 403;
    }

    # ================= STATIC FILE CACHING =================
    location ~* \.(gif|jpg|jpeg|png|bmp|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ================= DASHBOARD ROUTING =================
    location = /dashboard {
        return 301 /dashboard/;
    }

    location /dashboard/ {
        try_files $uri $uri/ /dashboard/index.php?$query_string;
    }
    
    # ================= GROUPS ROUTING =================
    location /groups {
        try_files $uri $uri/ /groups/index.php?$query_string;
    }
    
    # ================= AUTH API ROUTING =================
    location /api/auth/logout {
        try_files $uri $uri/ /api/auth/logout/index.php?$query_string;
    }

    # ================= LEGACY REWRITES (RESTORED) =================
    rewrite ^/user/(\d+)$ /user.php?id=$1 last;

    rewrite ^/store/view/(\d+)$ /store/view/index.php?id=$1 last;
    rewrite ^/store/edit/item/(\d+)$ /store/edit/item/index.php?id=$1 last;

    rewrite ^/forum/post/(\d+)$ /forum/post/index.php?id=$1 last;
    rewrite ^/forum/reply/(\d+)$ /forum/reply/index.php?id=$1 last;
    rewrite ^/forum/create/(\d+)$ /forum/create/index.php?id=$1 last;
    rewrite ^/forum/topic/(\d+)$ /forum/topic/index.php?id=$1 last;

    rewrite ^/group/view/(\d+)$ /group/view/index.php?id=$1 last;
    rewrite ^/group/admin/(\d+)$ /group/admin/index.php?id=$1 last;
    rewrite ^/group/ranks/(\d+)$ /group/ranks/index.php?id=$1 last;
    rewrite ^/group/members/(\d+)$ /group/members/index.php?id=$1 last;

    rewrite ^/user/inbox/view/(\d+)$ /user/inbox/view/index.php?id=$1 last;
    rewrite ^/user/inbox/send/(\d+)$ /user/inbox/send/index.php?id=$1 last;
    rewrite ^/user/report/(\d+)$ /user/report/index.php?id=$1 last;
    rewrite ^/user/friends/(\d+)$ /user/friends/index.php?id=$1 last;

    rewrite ^/store/report/(\d+)$ /store/report/index.php?id=$1 last;
    rewrite ^/admin/modify/(\d+)$ /admin/modify/index.php?id=$1 last;
    rewrite ^/trades/view/(\d+)$ /trades/view/index.php?id=$1 last;

    # ================= PHP HANDLER =================
    location ~ \.php$ {

        # Block PHP execution in uploads
        location ~ ^/uploads/.*\.php$ {
            return 403;
        }

        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # ================= MAIN ROUTER =================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ================= LIGHT ATTACK MITIGATION =================
    if ($query_string ~* "(base64_encode|union.*select|concat|<script|javascript:)") {
        return 403;
    }

    location ~* "(eval\(|system\(|exec\(|shell_exec\(|phpinfo\()" {
        return 403;
    }

    # ================= ERROR PAGES =================
    error_page 403 /errors/index.php;
    error_page 404 /errors/index.php;
    error_page 502 /errors/index.php;
    error_page 503 /errors/index.php;

    # ================= LOGGING =================
    access_log /www/wwwlogs/bricktaria.com.access.log;
    error_log  /www/wwwlogs/bricktaria.com.error.log warn;
}
