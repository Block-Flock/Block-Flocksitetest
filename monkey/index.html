<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GLTF Model Editor</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #container { position: relative; }
        canvas { display: block; }

        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            z-index: 1;
            font-family: sans-serif;
        }

        .controls input[type="file"] {
            margin-top: 6px;
        }

        #loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: black;
            font-size: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>
<div id="container">
    <div class="controls">
        <label>Upload Model: <input type="file" id="modelInput" accept=".glb,.gltf" /></label><br>
        <label>Change Color: <input type="color" id="colorPicker" value="#ffffff" /></label><br>
        <label>Change Texture: <input type="file" id="textureInput" accept="image/*" /></label>
    </div>
    <div id="loading">Loading...</div>
    <canvas id="canvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/examples/js/loaders/GLTFLoader.js"></script>

<script>
    let scene, camera, renderer, controls;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let selectedMesh = null;
    let currentModel = null;

    const canvas = document.getElementById('canvas');
    const loadingDiv = document.getElementById('loading');

    init();
    animate();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 2, 2);

        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        window.addEventListener('resize', onWindowResize);
        window.addEventListener('click', onClick);

        // Inputs
        document.getElementById('modelInput').addEventListener('change', handleModelUpload);
        document.getElementById('colorPicker').addEventListener('input', handleColorChange);
        document.getElementById('textureInput').addEventListener('change', handleTextureUpload);
    }

    function handleModelUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const arrayBuffer = e.target.result;
            const loader = new THREE.GLTFLoader();

            loadingDiv.style.display = 'block';

            loader.parse(arrayBuffer, '', function(gltf) {
                if (currentModel) {
                    scene.remove(currentModel);
                }

                currentModel = gltf.scene;
                scene.add(currentModel);
                loadingDiv.style.display = 'none';
            }, function(error) {
                console.error('Failed to load model:', error);
                loadingDiv.style.display = 'none';
            });
        };
        reader.readAsArrayBuffer(file);
    }

    function handleColorChange(e) {
        if (selectedMesh && selectedMesh.material) {
            selectedMesh.material.color.set(e.target.value);
            selectedMesh.material.map = null;
            selectedMesh.material.needsUpdate = true;
        }
    }

    function handleTextureUpload(e) {
        if (selectedMesh && selectedMesh.material && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                const texture = new THREE.TextureLoader().load(evt.target.result);
                selectedMesh.material.map = texture;
                selectedMesh.material.color.set(0xffffff);
                selectedMesh.material.needsUpdate = true;
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    }

    function onClick(event) {
        // Normalize mouse coords
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);

        if (intersects.length > 0) {
            const obj = intersects[0].object;
            if (obj.isMesh) {
                selectedMesh = obj;
                const color = `#${obj.material.color.getHexString()}`;
                document.getElementById('colorPicker').value = color;
            }
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
